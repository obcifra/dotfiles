---
- name: Fetch and install Typst
  hosts: localhost
  become: false
  vars:
    package_id: "typst"
    package_version: "0.15.1"
    package_type: "archive"
    package_name: "typst-x86_64-unknown-linux-musl.tar.xz"
    package_link: "https://github.com/typst/typst/releases/download/v{{ package_version }}/{{ package_name }}"
    package_hash: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
    package_strip: 1
    package_bins:
      - src: "typst"
        lnk: "typst"
  tasks:
    - name: Fetch Package
      ansible.builtin.include_tasks: tasks/fetch_package.yml

    - name: Install Package
      ansible.builtin.include_tasks: tasks/install_package.yml
