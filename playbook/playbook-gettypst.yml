---
- name: Install Typst
  hosts: localhost
  become: false
  tasks:
    - name: Create temporary directory
      ansible.builtin.tempfile:
        state: directory
        suffix: ansible
      register: tmpdir
      check_mode: false

    - name: Download Typst
      ansible.builtin.get_url:
        url: "https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz"
        dest: "{{ tmpdir.path }}"
        mode: "0700"
        checksum: "sha256:a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d"

    - name: Extract Typst bundle
      ansible.builtin.unarchive:
        src: "{{ tmpdir.path }}/typst-x86_64-unknown-linux-musl.tar.xz"
        dest: "{{ ansible_env.HOME }}/.local"

    - name: Add Typst to path
      ansible.builtin.lineinfile:
        path: "{{ ansible_env.HOME }}/.bashrc_local"
        line: "export PATH={{ ansible_env.HOME }}/.local/typst-x86_64-unknown-linux-musl:$PATH"
        mode: "0644"
        create: true
