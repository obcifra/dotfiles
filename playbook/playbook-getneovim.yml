---
- name: Fetch and install Neovim
  hosts: localhost
  become: false
  vars:
    package_id: "nvim"
    package_version: "0.12.6"
    package_type: "archive"
    package_name: "nvim-linux-x86_64.tar.gz"
    package_link: "https://github.com/neovim/neovim/releases/download/v{{ package_version }}/{{ package_name }}"
    package_hash: "474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87"
    package_strip: 1
    package_bins:
      - src: "bin/nvim"
        lnk: "nvim"
  tasks:
    - name: Fetch Package
      ansible.builtin.include_tasks: tasks/fetch_package.yml

    - name: Install Package
      ansible.builtin.include_tasks: tasks/install_package.yml
