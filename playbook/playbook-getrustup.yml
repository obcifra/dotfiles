---
- name: Fetch and install rustup
  hosts: localhost
  become: false
  vars:
    package_id: "rustup"
    package_version: "1.27.1"
    package_type: "binary"
    package_name: "rustup-init"
    package_link: "https://static.rust-lang.org/rustup/archive/{{ package_version }}/x86_64-unknown-linux-gnu/{{ package_name }}"
    package_hash: "6aeece6993e902708983b209d04c0d1dbb14ebb405ddb87def578d41f920f56d"
    package_bins:
      - src: "rustup-init"
  tasks:
    - name: Check installed version of rustup
      ansible.builtin.command: "{{ ansible_env.HOME }}/.cargo/bin/rustup --version"
      register: rustup_version_check
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Set installed rustup version fact
      ansible.builtin.set_fact:
        installed_rustup_version: "{{ rustup_version_check.stdout | default('') | regex_findall('rustup ([0-9.]+)') | first | default('') }}"

    - name: Fetch Package
      ansible.builtin.include_tasks: tasks/fetch_package.yml

    - name: Install Package
      ansible.builtin.include_tasks: tasks/install_package.yml

    # rustup-init also upgrades or downgrades an existing install to this version.
    - name: Run rustup-init
      ansible.builtin.command: "{{ package_dir }}/rustup-init -y --no-modify-path"
      when: installed_rustup_version != package_version
      changed_when: true
