---
- name: Configure Python Environment
  hosts: localhost
  become: false
  vars:
    package_id: "uv"
    package_version: "0.13.9"
    package_type: "archive"
    package_name: "uv-x86_64-unknown-linux-gnu.tar.gz"
    package_link: "https://github.com/astral-sh/uv/releases/download/{{ package_version }}/{{ package_name }}"
    package_hash: "a7fbaff2b9a271d85c1bdb540941090fd1ce011797b4abeb48e4dcd39c2471d5"
    package_strip: 1
    package_bins:
      - src: "uv"
        lnk: "uv"
      - src: "uvx"
        lnk: "uvx"
    python_versions:
      - "3.11"
      - "3.12"
      - "3.13"
      - "3.14"
  tasks:
    - name: Fetch uv
      ansible.builtin.include_tasks: tasks/fetch_package.yml

    - name: Install uv
      ansible.builtin.include_tasks: tasks/install_package.yml

    - name: Install Python versions
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/uv python install {{ item }}"
      register: uv_python
      changed_when: "'Installed' in uv_python.stderr"
      loop: "{{ python_versions }}"

    # uv is now installed permanently; the bootstrap copy created by
    # `play --bootstrap` is no longer needed.
    - name: Remove uv bootstrap
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bootstrap"
        state: absent
