---
- name: Oxidize
  hosts: localhost
  become: false
  environment:
    TMPDIR: "{{ TMPDIR | default('/tmp') }}"
  vars:
    tools:
      - name: mdbook
        version: 0.5.2
        exe: mdbook

      - name: mdbook-mermaid
        version: 0.17.0
        exe: mdbook-mermaid

      - name: exa # ls
        version: 0.10.1
        exe: exa

      - name: fd-find # find
        version: 10.4.2
        exe: fd

      - name: ripgrep # grep
        version: 15.1.0
        exe: rg

      - name: bat # cat
        version: 0.26.1
        exe: bat

      - name: grex # regexgen
        version: 1.4.6
        exe: grex

      - name: tokei # cloc
        version: 14.0.0
        exe: tokei

      - name: du-dust # du
        version: 1.2.4
        exe: dust

      - name: eva # bc
        version: 0.3.1
        exe: eva
  tasks:
    - name: Check existing tool installation
      ansible.builtin.command: "{{ item.exe }} --version"
      register: version_output
      ignore_errors: true
      loop: "{{ tools }}"
      changed_when: false

    - name: Fetch versions of installed tools
      ansible.builtin.set_fact:
        updated_tools: "{{ updated_tools | default([]) + [item.0 | combine({'installed_version': installed})] }}"
      vars:
        installed: "{{ item.1.stdout | regex_search('[0-9]+\\.[0-9]+\\.[0-9]+') }}"
      with_together:
        - "{{ tools }}"
        - "{{ version_output.results }}"
      loop_control:
        label: "{{ item.0.name }}"

    - name: Install tools, as required
      ansible.builtin.shell: >
        cargo install {{ item.name }} --version {{ item.version }}
      args:
        executable: /bin/bash
      when: item.version != item.installed_version
      changed_when: item.version != item.installed_version
      loop: "{{ updated_tools }}"
